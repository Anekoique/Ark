name: Auto-tag on version bump

# When a push to main changes [workspace.package].version in Cargo.toml,
# wait for CI to pass on that commit, then create and push a vX.Y.Z tag.
# The tag push triggers release.yml.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
          # PAT (RELEASE_PAT) so the tag push is attributed to a user
          # account and can trigger release.yml. GITHUB_TOKEN-pushed tags
          # do NOT fire downstream `on: push: tags` workflows.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Detect version change
        id: version
        run: |
          set -euo pipefail

          extract_version() {
            awk '
              /^\[workspace\.package\]/ { in_section=1; next }
              /^\[/                     { in_section=0 }
              in_section && /^version[[:space:]]*=/ {
                if (match($0, /"[^"]*"/)) {
                  print substr($0, RSTART+1, RLENGTH-2)
                  exit
                }
              }
            '
          }

          new=$(extract_version < Cargo.toml)

          if [ -z "$new" ]; then
            echo "no version found in [workspace.package]; skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old=$(git show HEAD~1:Cargo.toml 2>/dev/null | extract_version || echo "")

          echo "old=$old"
          echo "new=$new"

          if [ "$old" = "$new" ]; then
            echo "version unchanged; skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$new"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Wait for CI to pass
        if: steps.version.outputs.changed == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: build
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
