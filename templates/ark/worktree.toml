# Worktree configuration for `ark agent task new --worktree`.
#
# This file is created by `ark init` and is NOT overwritten by `ark upgrade`.
# Edit freely — your changes survive across upgrades.

# Where worktrees are stored, project-relative.
worktree_dir = ".ark/worktrees"

# Branch type prefix used when neither --branch-type nor --branch is passed.
# One of: feat, fix, refactor, chore, ci, docs.
branch_prefix = "feat"

# Files copied from the project root into each new worktree.
# Useful for local-only files that aren't tracked in git but are needed in
# every checkout (e.g. .env). Source-not-found is a hard error.
copy = []

# Shell commands run in the worktree directory after creation, in order,
# aborting on first non-zero exit.
post_create = []
